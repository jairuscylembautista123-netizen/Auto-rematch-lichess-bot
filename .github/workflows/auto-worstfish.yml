name: Auto Rematch Worstfish

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Runs at 0 minutes past the hour, every 6 hours

concurrency:
  group: auto-rematch-worstfish
  cancel-in-progress: true

jobs:
  rematch-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run Auto-Rematch Loop (5h 25m)
        continue-on-error: true
        env:
          LICHESS_BOT: ${{ secrets.LICHESS_BOT }}
        run: |
          timeout -s INT 19500 python -u -c '
          import os
          import sys
          import time
          import requests

          token = os.environ["LICHESS_BOT"]
          my_bot = "WorserFish19"
          target_bot = "WorstFish"
          s = chr(47)
          base = "https:" + s + s + "lichess.org" + s + "api"
          headers = {"Authorization": "Bearer " + token}
          start_time = time.time()
          max_runtime = 19500

          def send_challenge():
              url = base + s + "challenge" + s + target_bot
              r = requests.post(
                  url,
                  headers=headers,
                  data={
                      "rated": "false",
                      "clock.limit": 1200,
                      "clock.increment": 0,
                      "variant": "standard",
                  },
              )
              print("Challenge response:", r.status_code, r.text)
              if r.status_code in (400, 429):
                  try:
                      data = r.json()
                      wait_sec = data.get("ratelimit", {}).get("seconds")
                  except Exception:
                      wait_sec = None

                  if wait_sec is not None:
                      remaining_job_time = max_runtime - (time.time() - start_time)
                      if wait_sec + 5 > remaining_job_time:
                          print(f"Daily rate limit hit ({wait_sec}s remaining), exceeds job window. Exiting cleanly until next cron run.")
                          sys.exit(0)
                      print(f"Rate limited! Sleeping for {wait_sec + 5}s...")
                      time.sleep(wait_sec + 5)
                  elif r.status_code == 429:
                      print("Rate limited (429)! Sleeping for 65s...")
                      time.sleep(65)

          def is_playing():
              url = base + s + "users" + s + "status?ids=" + my_bot
              r = requests.get(url)
              if r.status_code == 200:
                  data = r.json()
                  if data and data[0].get("playing"):
                      return True
                  return False
              print("Status check error:", r.status_code)
              return False

          while True:
              try:
                  if not is_playing():
                      print(my_bot, "is free! Challenging", target_bot)
                      send_challenge()
                      time.sleep(20)
                  else:
                      print("Still battling... checking again in 20s")
                      time.sleep(20)
              except Exception as e:
                  print("Error:", e)
                  time.sleep(15)
          '
