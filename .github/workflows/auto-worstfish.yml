name: Auto Rematch Worstfish

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: auto-rematch-worstfish
  cancel-in-progress: false

jobs:
  rematch-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Install requests
        run: python3 -m pip install -q requests

      - name: Run Auto-Rematch Loop (5h 20m)
        continue-on-error: true
        env:
          LICHESS_BOT: ${{ secrets.LICHESS_BOT }}
        run: |
          python3 -u -c '
          import os
          import time
          import requests

          token = os.environ["LICHESS_BOT"]
          my_bot = "WorserFish19"
          target_bot = "WorstFish"
          s = chr(47)
          base = "https:" + s + s + "lichess.org" + s + "api"
          headers = {"Authorization": "Bearer " + token}

          start_time = time.time()
          max_runtime = 19200 # 5h 20m

          def send_challenge():
              url = base + s + "challenge" + s + target_bot
              r = requests.post(
                  url,
                  headers=headers,
                  data={
                      "rated": "false",
                      "clock.limit": 1200,
                      "clock.increment": 0,
                      "variant": "standard",
                  },
              )
              print("Challenge response:", r.status_code, r.text)
              if r.status_code in (400, 429):
                  try:
                      data = r.json()
                      wait_sec = data.get("ratelimit", {}).get("seconds") if isinstance(data, dict) else None
                  except Exception:
                      wait_sec = None

                  if wait_sec is not None:
                      sleep_for = wait_sec + 5
                      remaining = max_runtime - (time.time() - start_time)
                      actual_sleep = min(sleep_for, max(0, remaining))
                      print(f"Rate limited! Sleeping for {int(actual_sleep)}s (full cooldown: {sleep_for}s)...")
                      time.sleep(actual_sleep)
                  elif r.status_code == 429:
                      print("Rate limited (429)! Sleeping for 65s...")
                      time.sleep(65)

          def is_playing():
              url = base + s + "users" + s + "status?ids=" + my_bot
              r = requests.get(url)
              if r.status_code == 200:
                  data = r.json()
                  if isinstance(data, list) and len(data) > 0 and data[0].get("playing"):
                      return True
                  return False
              print("Status check error:", r.status_code)
              return False

          while (time.time() - start_time) < max_runtime:
              try:
                  if not is_playing():
                      print(my_bot, "is free! Challenging", target_bot)
                      send_challenge()
                      time.sleep(20)
                  else:
                      print("Still battling... checking again in 20s")
                      time.sleep(20)
              except Exception as e:
                  print("Error:", e)
                  time.sleep(15)

          print("5h 20m reached! Handing off to restart step...")
          '

      - name: Auto-Restart Next Run
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          curl -i -s -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://github.com" \
            -d '{"ref":"main"}'
